<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Dashboard interattiva con design Neumorphic moderno - Include orologio, player audio, e componenti UI interattivi">
  <meta name="keywords" content="dashboard, neumorphic, design, UI components, audio player">
  <meta name="author" content="Fabio Murtas">
  <meta id="theme-color-meta" name="theme-color" content="#E4EBF5">

  <meta property="og:title" content="Neumorphic Dashboard">
  <meta property="og:description" content="Dashboard interattiva con design Neumorphic moderno">
  <meta property="og:type" content="website">

  <title>Neumorphic Dashboard | UI Components Interattivi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,700&display=swap" rel="stylesheet">

  <script type="module" src="https://unpkg.com/ionicons@5.0.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule="" src="https://unpkg.com/ionicons@5.0.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
  <audio id="audio-player" preload="metadata" aria-label="Audio player">
    <source src="04 - Boss Theme 3.mp3" type="audio/mpeg">
    Il tuo browser non supporta l'elemento audio.
  </audio>

  <main class="container" role="main">
    <section class="dashboard-compact" aria-label="Dashboard principale">

      <header class="dashboard-header" data-tauri-drag-region>
        <div class="clock" role="img" aria-label="Orologio analogico">
          <div class="hand hours"></div>
          <div class="hand minutes"></div>
          <div class="hand seconds"></div>
          <div class="point"></div>
          <div class="marker">
            <span class="marker__1" aria-hidden="true"></span>
            <span class="marker__2" aria-hidden="true"></span>
            <span class="marker__3" aria-hidden="true"></span>
            <span class="marker__4" aria-hidden="true"></span>
          </div>
        </div>

        <div class="dashboard-title" data-tauri-drag-region>
          <h1 data-tauri-drag-region>Dashboard Neumorphic</h1>
          <p data-tauri-drag-region>Il tuo spazio personale</p>
        </div>

        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambia tema" aria-pressed="false">
          <ion-icon name="sunny" class="theme-icon sun-icon" aria-hidden="true"></ion-icon>
          <ion-icon name="moon" class="theme-icon moon-icon" aria-hidden="true"></ion-icon>
          <span class="theme-toggle-slider" aria-hidden="true"></span>
        </button>
      </header>

      <section class="audio-player-section" aria-label="Player audio">
        <div class="player-controls">
          <button class="circle__btn" type="button" aria-label="Play/Pause audio" aria-pressed="false">
            <ion-icon class="play" name="play" aria-hidden="true"></ion-icon>
            <ion-icon class="pause" name="pause" aria-hidden="true"></ion-icon>
          </button>
          <span class="circle__back-1 paused" aria-hidden="true"></span>
          <span class="circle__back-2 paused" aria-hidden="true"></span>
        </div>

        <div class="player-info">
          <div class="track-title" id="current-track-name">04 - Boss Theme 3.mp3</div>
          <div class="volume-control">
            <ion-icon name="volume-medium" aria-hidden="true"></ion-icon>
            <label class="volume-slider-label" for="volume-slider">Volume</label>
            <input id="volume-slider" class="volume-slider" type="range" min="0" max="100" value="50" step="1" aria-label="Volume">
            <span id="volume-value" class="volume-value" aria-live="polite">50%</span>
          </div>
        </div>

        <div class="vu-meter" aria-hidden="true">
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
        </div>
      </section>

      <nav class="main-tabs" role="tablist" aria-label="Sezioni dashboard">
        <button id="tab-playlist" class="tab-btn active" type="button" data-tab="playlist" role="tab" aria-selected="true" aria-controls="playlist-tab" tabindex="0">
          <ion-icon name="musical-notes" aria-hidden="true"></ion-icon>
          <span>Playlist</span>
        </button>
        <button id="tab-search" class="tab-btn" type="button" data-tab="search" role="tab" aria-selected="false" aria-controls="search-tab" tabindex="-1">
          <ion-icon name="search" aria-hidden="true"></ion-icon>
          <span>Ricerca</span>
        </button>
        <button id="tab-notes" class="tab-btn" type="button" data-tab="notes" role="tab" aria-selected="false" aria-controls="notes-tab" tabindex="-1">
          <ion-icon name="document-text" aria-hidden="true"></ion-icon>
          <span>Note</span>
        </button>
      </nav>

      <section class="tab-content active" id="playlist-tab" role="tabpanel" aria-labelledby="tab-playlist">
        <div class="tab-header">
          <h2>La tua Playlist</h2>
          <label for="audio-upload" class="btn-upload" aria-label="Carica file audio">
            <ion-icon name="add-circle" aria-hidden="true"></ion-icon>
            <span>Carica</span>
          </label>
          <input type="file" id="audio-upload" accept="audio/*" multiple hidden>
        </div>

        <div class="playlist-container" id="playlist" role="list">
          <div class="playlist-empty">
            <ion-icon name="musical-notes-outline" aria-hidden="true"></ion-icon>
            <p>Nessuna traccia caricata</p>
          </div>
        </div>
      </section>

      <section class="tab-content" id="search-tab" role="tabpanel" aria-labelledby="tab-search">
        <div class="tab-header">
          <h2>Ricerca Internet</h2>
        </div>

        <form class="search-form" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" role="search">
          <div class="search-input-wrapper">
            <ion-icon name="search" aria-hidden="true"></ion-icon>
            <input type="text" name="q" class="search-input" placeholder="Cerca su Google..." aria-label="Campo di ricerca" required>
            <button type="submit" class="search-btn" aria-label="Avvia ricerca">
              <ion-icon name="arrow-forward" aria-hidden="true"></ion-icon>
            </button>
          </div>
        </form>

        <div class="search-suggestions">
          <p class="section-label">Ricerche rapide:</p>
          <div class="quick-searches">
            <button class="quick-search-btn" type="button" data-query="meteo">
              <ion-icon name="partly-sunny" aria-hidden="true"></ion-icon>
              Meteo
            </button>
            <button class="quick-search-btn" type="button" data-query="notizie">
              <ion-icon name="newspaper" aria-hidden="true"></ion-icon>
              Notizie
            </button>
            <button class="quick-search-btn" type="button" data-query="youtube">
              <ion-icon name="logo-youtube" aria-hidden="true"></ion-icon>
              YouTube
            </button>
            <button class="quick-search-btn" type="button" data-query="gmail">
              <ion-icon name="mail" aria-hidden="true"></ion-icon>
              Gmail
            </button>
          </div>
        </div>
      </section>

      <section class="tab-content" id="notes-tab" role="tabpanel" aria-labelledby="tab-notes">
        <div class="tab-header">
          <h2>Le tue Note</h2>
          <button class="btn-save-notes" id="save-notes" type="button">
            <ion-icon name="save" aria-hidden="true"></ion-icon>
            <span>Salva</span>
          </button>
        </div>

        <textarea
          class="notes-editor"
          id="notes-textarea"
          placeholder="Scrivi le tue note qui...&#10;&#10;Le note vengono salvate automaticamente nel browser."
          aria-label="Editor note"
        ></textarea>

        <div class="notes-info">
          <ion-icon name="information-circle" aria-hidden="true"></ion-icon>
          <span id="notes-status">Ultima modifica: mai</span>
        </div>
      </section>

    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
